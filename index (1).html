<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#fb923c" />
<title>우리반 자랑하기</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="자랑하기" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; }
  .hand { font-family: 'Gaegu', cursive; }
  .sans { font-family: 'Noto Sans KR', sans-serif; }
  .dodum { font-family: 'Gowun Dodum', sans-serif; }
  @keyframes popIn { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes celebrate { 0% { transform: scale(0.5) rotate(-10deg); opacity: 0; } 50% { transform: scale(1.2) rotate(5deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(251, 146, 60, 0.4); } 50% { box-shadow: 0 0 0 12px rgba(251, 146, 60, 0); } }
  .pop-in { animation: popIn 0.3s ease-out; }
  .celebrate { animation: celebrate 0.6s ease-out; }
  .float { animation: float 3s ease-in-out infinite; }
  .pulse-glow { animation: pulse-glow 2s infinite; }
  .card-shadow { box-shadow: 0 4px 20px -6px rgba(0,0,0,0.1); }
  .hover-lift { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
  .hover-lift:hover { transform: translateY(-2px); box-shadow: 0 8px 24px -8px rgba(0,0,0,0.15); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-type="module">
const { useState, useMemo, useRef, useEffect } = React;

// Lucide 아이콘을 간단한 SVG 컴포넌트로 래핑
const Icon = ({ name, className = '', strokeWidth = 2, fill = 'none' }) => {
  const svgRef = useRef(null);
  useEffect(() => {
    if (svgRef.current && window.lucide) {
      svgRef.current.innerHTML = '';
      const icon = window.lucide.icons[name];
      if (icon) {
        const svg = window.lucide.createElement(icon);
        svg.setAttribute('stroke-width', strokeWidth);
        if (fill !== 'none') svg.setAttribute('fill', fill);
        svgRef.current.appendChild(svg);
      }
    }
  }, [name, strokeWidth, fill]);
  return <span ref={svgRef} className={`inline-flex ${className}`} />;
};

function App() {
  const [students, setStudents] = useState(() => {
    try { return JSON.parse(localStorage.getItem('brag_students') || '[]'); } catch { return []; }
  });
  const [selectedIds, setSelectedIds] = useState(new Set());
  const [teacherName, setTeacherName] = useState(() => localStorage.getItem('brag_teacher') || '');
  const [reason, setReason] = useState('');
  const [searchQuery, setSearchQuery] = useState('');
  const [classFilter, setClassFilter] = useState('전체');
  const [csvError, setCsvError] = useState('');
  const [recommendationLog, setRecommendationLog] = useState(() => {
    try { return JSON.parse(localStorage.getItem('brag_log') || '[]'); } catch { return []; }
  });
  const [mode, setMode] = useState('home');
  const [miniIndex, setMiniIndex] = useState(0);
  const [miniCandidates, setMiniCandidates] = useState([]);
  const [showInstall, setShowInstall] = useState(false);
  const [justBragged, setJustBragged] = useState(null);
  const csvInputRef = useRef(null);

  // 데이터 저장
  useEffect(() => { localStorage.setItem('brag_students', JSON.stringify(students)); }, [students]);
  useEffect(() => { localStorage.setItem('brag_log', JSON.stringify(recommendationLog)); }, [recommendationLog]);
  useEffect(() => { localStorage.setItem('brag_teacher', teacherName); }, [teacherName]);

  const getWeekKey = (date = new Date()) => {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + 4 - (d.getDay() || 7));
    const yearStart = new Date(d.getFullYear(), 0, 1);
    const weekNo = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
    return `${d.getFullYear()}-W${String(weekNo).padStart(2, '0')}`;
  };
  const currentWeek = getWeekKey();

  const parseCSV = (text) => {
    const lines = text.trim().split(/\r?\n/);
    if (lines.length < 2) return [];
    const parseLine = (line) => {
      const result = []; let current = ''; let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') inQuotes = !inQuotes;
        else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
        else current += char;
      }
      result.push(current.trim());
      return result;
    };
    const headers = parseLine(lines[0]).map(h => h.replace(/^"|"$/g, ''));
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      const values = parseLine(lines[i]).map(v => v.replace(/^"|"$/g, ''));
      const row = {};
      headers.forEach((h, idx) => { row[h] = values[idx] || ''; });
      rows.push(row);
    }
    return rows;
  };

  const handleCSVUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setCsvError('');
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const rows = parseCSV(event.target.result);
        if (rows.length === 0) { setCsvError('CSV에 데이터가 없습니다.'); return; }
        const keys = Object.keys(rows[0]);
        const hasName = keys.some(k => ['이름', 'name', '성명'].includes(k.toLowerCase()) || k === '이름');
        if (!hasName) { setCsvError('CSV에 "이름" 열이 필요합니다.'); return; }
        const newStudents = rows.map((row, idx) => ({
          id: `student_${Date.now()}_${idx}`,
          name: row['이름'] || row['name'] || row['성명'] || '',
          class: row['반'] || row['class'] || row['학급'] || '',
          number: row['번호'] || row['no'] || row['출석번호'] || '',
          photo: (row['사진'] || row['photo'] || row['photo_url'] || row['사진URL'] || '').trim(),
        })).filter(s => s.name);
        setStudents(prev => [...prev, ...newStudents]);
        if (csvInputRef.current) csvInputRef.current.value = '';
      } catch (err) { setCsvError('CSV 파싱 오류: ' + err.message); }
    };
    reader.readAsText(file, 'UTF-8');
  };

  const handlePhotoUpload = (studentId, file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      setStudents(prev => prev.map(s => s.id === studentId ? { ...s, photo: e.target.result } : s));
    };
    reader.readAsDataURL(file);
  };

  const loadSampleData = () => {
    const samples = [
      { name: '김민준', class: '1-1', number: '1' }, { name: '이서연', class: '1-1', number: '2' },
      { name: '박도윤', class: '1-1', number: '3' }, { name: '최지우', class: '1-1', number: '4' },
      { name: '정하은', class: '1-2', number: '1' }, { name: '강시우', class: '1-2', number: '2' },
      { name: '윤서준', class: '1-2', number: '3' }, { name: '임채원', class: '1-2', number: '4' },
      { name: '한지호', class: '1-3', number: '1' }, { name: '오예린', class: '1-3', number: '2' },
      { name: '배건우', class: '1-3', number: '3' }, { name: '송유진', class: '1-3', number: '4' },
    ].map((s, idx) => ({ ...s, id: `sample_${Date.now()}_${idx}`, photo: '' }));
    setStudents(prev => [...prev, ...samples]);
  };

  const toggleSelect = (id) => {
    setSelectedIds(prev => { const next = new Set(prev); if (next.has(id)) next.delete(id); else next.add(id); return next; });
  };
  const removeStudent = (id) => {
    setStudents(prev => prev.filter(s => s.id !== id));
    setSelectedIds(prev => { const n = new Set(prev); n.delete(id); return n; });
  };

  const filteredStudents = useMemo(() => students.filter(s => {
    const matchClass = classFilter === '전체' || s.class === classFilter;
    const matchSearch = !searchQuery || s.name.includes(searchQuery) || s.class.includes(searchQuery) || s.number.includes(searchQuery);
    return matchClass && matchSearch;
  }), [students, searchQuery, classFilter]);

  const classes = useMemo(() => {
    const set = new Set(students.map(s => s.class).filter(Boolean));
    return ['전체', ...Array.from(set).sort()];
  }, [students]);

  const startMiniMode = () => {
    if (!teacherName.trim()) { alert('먼저 선생님 이름을 입력해주세요.'); return; }
    if (students.length === 0) { alert('학생 명단이 비어있어요.'); return; }
    const shuffled = [...students].sort(() => Math.random() - 0.5);
    setMiniCandidates(shuffled.slice(0, Math.min(12, students.length)));
    setMiniIndex(0);
    setMode('mini');
  };

  const bragOne = (student, quickReason = '') => {
    const entry = {
      timestamp: new Date().toLocaleString('ko-KR'), week: currentWeek,
      teacher: teacherName.trim(), studentName: student.name,
      class: student.class, number: student.number,
      reason: quickReason || reason.trim(), mode: 'mini',
    };
    setRecommendationLog(prev => [entry, ...prev]);
    setJustBragged(student);
    setTimeout(() => setJustBragged(null), 1500);
  };

  const skipMini = () => {
    if (miniIndex < miniCandidates.length - 1) setMiniIndex(miniIndex + 1);
    else { setMode('home'); setReason(''); }
  };
  const nextMini = () => {
    if (miniIndex < miniCandidates.length - 1) { setMiniIndex(miniIndex + 1); setReason(''); }
    else { setMode('home'); setReason(''); alert('이번 주 자랑 완료! 고생하셨어요 🎉'); }
  };

  const submitBrag = () => {
    if (selectedIds.size === 0) return alert('자랑할 학생을 선택해주세요.');
    if (!teacherName.trim()) return alert('선생님 이름을 입력해주세요.');
    const selected = students.filter(s => selectedIds.has(s.id));
    const entries = selected.map(s => ({
      timestamp: new Date().toLocaleString('ko-KR'), week: currentWeek,
      teacher: teacherName.trim(), studentName: s.name, class: s.class,
      number: s.number, reason: reason.trim(), mode: 'full',
    }));
    setRecommendationLog(prev => [...entries, ...prev]);
    setSelectedIds(new Set()); setReason('');
    alert(`${selected.length}명 자랑 완료 🎉`);
  };

  const downloadCSV = () => {
    if (recommendationLog.length === 0) return alert('다운로드할 내역이 없어요.');
    const headers = ['자랑일시', '주차', '선생님', '학생이름', '반', '번호', '한마디', '모드'];
    const rows = recommendationLog.map(r => [r.timestamp, r.week, r.teacher, r.studentName, r.class, r.number, r.reason, r.mode]);
    const csv = [headers, ...rows].map(row => row.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a'); link.href = url;
    link.download = `자랑_${new Date().toISOString().slice(0,10)}.csv`;
    link.click(); URL.revokeObjectURL(url);
  };

  const downloadTemplate = () => {
    const tpl = '이름,반,번호,사진\n김민준,1-1,1,\n이서연,1-1,2,\n';
    const blob = new Blob(['\uFEFF' + tpl], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a'); link.href = url;
    link.download = '학생명단_템플릿.csv';
    link.click(); URL.revokeObjectURL(url);
  };

  const stats = useMemo(() => {
    const thisWeek = recommendationLog.filter(r => r.week === currentWeek);
    const uniqueTeachers = new Set(recommendationLog.map(r => r.teacher));
    const thisWeekTeachers = new Set(thisWeek.map(r => r.teacher));
    const uniqueStudents = new Set(recommendationLog.map(r => `${r.class}_${r.studentName}`));
    const studentCount = {};
    recommendationLog.forEach(r => {
      const key = `${r.class}_${r.studentName}`;
      studentCount[key] = (studentCount[key] || 0) + 1;
    });
    const topStudents = Object.entries(studentCount).map(([key, count]) => {
      const [cls, name] = key.split('_'); return { name, class: cls, count };
    }).sort((a, b) => b.count - a.count).slice(0, 5);
    return {
      total: recommendationLog.length, thisWeek: thisWeek.length,
      totalTeachers: uniqueTeachers.size, thisWeekTeachers: thisWeekTeachers.size,
      uniqueStudents: uniqueStudents.size, topStudents,
    };
  }, [recommendationLog, currentWeek]);

  useEffect(() => {
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
    if (!isStandalone && !localStorage.getItem('installDismissed')) {
      setTimeout(() => setShowInstall(true), 3000);
    }
  }, []);

  return (
    <div className="min-h-screen" style={{
      background: 'linear-gradient(135deg, #fef3e7 0%, #ffeadb 50%, #ffdfd0 100%)',
      fontFamily: "'Gowun Dodum', 'Noto Sans KR', sans-serif"
    }}>
      {showInstall && (
        <div className="fixed bottom-4 left-4 right-4 md:left-auto md:right-4 md:w-80 bg-stone-900 text-white p-4 z-50 card-shadow pop-in" style={{borderRadius: '16px'}}>
          <div className="flex items-start gap-3">
            <span className="text-xl">📱</span>
            <div className="flex-1 text-sm">
              <div className="font-bold mb-1">홈화면에 추가하기</div>
              <div className="text-stone-300 text-xs leading-relaxed">
                iOS: Safari 공유 → "홈 화면에 추가"<br/>
                Android: Chrome 메뉴 → "홈 화면에 추가"
              </div>
            </div>
            <button onClick={() => { setShowInstall(false); localStorage.setItem('installDismissed', '1'); }} className="text-stone-400 hover:text-white">✕</button>
          </div>
        </div>
      )}

      <header className="bg-white/60 backdrop-blur-sm border-b border-orange-200/50 sticky top-0 z-40">
        <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
          <button onClick={() => setMode('home')} className="flex items-center gap-2">
            <div className="w-9 h-9 flex items-center justify-center text-2xl float">🌟</div>
            <div>
              <div className="hand text-xl font-bold text-stone-800 leading-tight">우리반 자랑하기</div>
              <div className="text-[10px] text-stone-500 sans tracking-wider">BRAG BOARD</div>
            </div>
          </button>
          <div className="flex gap-1">
            <NavBtn active={mode === 'home'} onClick={() => setMode('home')} emoji="🏠" label="홈" />
            <NavBtn active={mode === 'dashboard'} onClick={() => setMode('dashboard')} emoji="📊" label="현황" />
            <NavBtn active={mode === 'manage'} onClick={() => setMode('manage')} emoji="👥" label="명단" />
          </div>
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-4 py-6">
        {mode === 'home' && (
          <div className="pop-in">
            <div className="text-center py-8">
              <div className="text-6xl mb-3 float">🌟</div>
              <h1 className="hand text-4xl font-bold text-stone-800 mb-2">이번 주, 누구를 자랑할까요?</h1>
              <p className="dodum text-stone-600">선생님이 본 학생의 좋은 모습, 한 줄이면 충분해요</p>
            </div>
            <div className="max-w-md mx-auto mb-6">
              <label className="dodum text-sm text-stone-600 mb-2 block">선생님 성함</label>
              <input type="text" value={teacherName} onChange={e => setTeacherName(e.target.value)} placeholder="예: 홍길동"
                className="dodum w-full px-4 py-3 bg-white/80 border-2 border-orange-200 focus:border-orange-400 focus:outline-none rounded-2xl text-stone-800" />
            </div>
            <div className="grid md:grid-cols-2 gap-4 max-w-3xl mx-auto mb-8">
              <button onClick={startMiniMode} disabled={students.length === 0}
                className="relative bg-gradient-to-br from-orange-400 to-pink-500 text-white p-6 rounded-3xl text-left hover-lift disabled:opacity-50 disabled:cursor-not-allowed pulse-glow" style={{minHeight: '180px'}}>
                <div className="flex items-center justify-between mb-3">
                  <span className="text-3xl">⚡</span>
                  <span className="hand text-xs bg-white/20 px-2 py-1 rounded-full">30초 컷</span>
                </div>
                <div className="hand text-3xl font-bold mb-1">미니 자랑</div>
                <div className="dodum text-sm opacity-90 mb-3">12명 중에서 떠오르는 학생만 자랑해요</div>
                <div className="hand text-sm font-bold">시작하기 →</div>
              </button>
              <button onClick={() => setMode('full')} disabled={students.length === 0}
                className="relative bg-white border-2 border-stone-200 p-6 rounded-3xl text-left hover-lift disabled:opacity-50 disabled:cursor-not-allowed" style={{minHeight: '180px'}}>
                <div className="flex items-center justify-between mb-3">
                  <span className="text-3xl">👥</span>
                  <span className="hand text-xs bg-stone-100 text-stone-600 px-2 py-1 rounded-full">차분히</span>
                </div>
                <div className="hand text-3xl font-bold mb-1 text-stone-800">전체 보기</div>
                <div className="dodum text-sm text-stone-600 mb-3">모든 학생 사진을 보며 여러 명 자랑하기</div>
                <div className="hand text-sm font-bold text-stone-700">둘러보기 →</div>
              </button>
            </div>
            <div className="max-w-3xl mx-auto bg-white/60 backdrop-blur-sm rounded-3xl p-5 border border-orange-200/50">
              <div className="flex items-center justify-between mb-3">
                <div className="hand text-lg font-bold text-stone-800">📈 이번 주 우리 학교</div>
                <button onClick={() => setMode('dashboard')} className="hand text-xs text-orange-600">자세히 →</button>
              </div>
              <div className="grid grid-cols-3 gap-3">
                <MiniStat icon="🎉" value={stats.thisWeek} label="자랑 수" />
                <MiniStat icon="👩‍🏫" value={stats.thisWeekTeachers} label="참여 선생님" />
                <MiniStat icon="🌟" value={new Set(recommendationLog.filter(r => r.week === currentWeek).map(r => r.studentName)).size} label="자랑받은 학생" />
              </div>
            </div>
            {students.length === 0 && (
              <div className="max-w-md mx-auto mt-8 text-center">
                <p className="dodum text-stone-600 mb-4">학생 명단을 먼저 등록해주세요</p>
                <button onClick={() => setMode('manage')} className="hand bg-stone-800 text-white px-6 py-3 rounded-full font-bold">명단 등록하러 가기 →</button>
              </div>
            )}
          </div>
        )}

        {mode === 'mini' && miniCandidates[miniIndex] && (
          <div className="pop-in max-w-xl mx-auto">
            <div className="flex items-center justify-between mb-4">
              <button onClick={() => { setMode('home'); setReason(''); }} className="hand text-sm text-stone-500">← 그만하기</button>
              <div className="flex-1 mx-4 h-2 bg-white/60 rounded-full overflow-hidden">
                <div className="h-full bg-gradient-to-r from-orange-400 to-pink-500 transition-all" style={{width: `${((miniIndex + 1) / miniCandidates.length) * 100}%`}}></div>
              </div>
              <span className="hand text-sm text-stone-600">{miniIndex + 1} / {miniCandidates.length}</span>
            </div>
            <div className="bg-white rounded-3xl card-shadow overflow-hidden">
              <div className="aspect-square bg-gradient-to-br from-orange-100 to-pink-100 relative">
                {miniCandidates[miniIndex].photo ? (
                  <img src={miniCandidates[miniIndex].photo} alt="" className="w-full h-full object-cover" />
                ) : (
                  <div className="w-full h-full flex items-center justify-center text-stone-300" style={{fontSize: '120px'}}>👤</div>
                )}
                {justBragged?.id === miniCandidates[miniIndex].id && (
                  <div className="absolute inset-0 bg-gradient-to-t from-orange-500/80 to-pink-500/80 flex items-center justify-center celebrate">
                    <div className="text-center text-white">
                      <div className="text-7xl mb-2">🎉</div>
                      <div className="hand text-3xl font-bold">자랑 완료!</div>
                    </div>
                  </div>
                )}
              </div>
              <div className="p-6">
                <div className="text-center mb-4">
                  <div className="hand text-3xl font-bold text-stone-800">{miniCandidates[miniIndex].name}</div>
                  <div className="dodum text-sm text-stone-500 mt-1">
                    {miniCandidates[miniIndex].class} {miniCandidates[miniIndex].number && `${miniCandidates[miniIndex].number}번`}
                  </div>
                </div>
                <input type="text" value={reason} onChange={e => setReason(e.target.value)}
                  placeholder="한 줄 자랑 (선택) - 예: 친구 도와주는 모습이 예뻐요"
                  className="dodum w-full px-4 py-3 bg-stone-50 border-2 border-stone-200 focus:border-orange-400 focus:outline-none rounded-2xl text-sm mb-4" />
                <div className="flex flex-wrap gap-2 mb-5">
                  {['친구를 잘 도와요', '수업 태도가 좋아요', '인사를 밝게 해요', '꾸준히 노력해요', '청소를 잘해요'].map(tag => (
                    <button key={tag} onClick={() => setReason(tag)}
                      className="hand text-xs px-3 py-1.5 bg-orange-50 text-orange-700 rounded-full border border-orange-200 hover:bg-orange-100">{tag}</button>
                  ))}
                </div>
                <div className="grid grid-cols-3 gap-2">
                  <button onClick={skipMini} className="hand col-span-1 py-3 bg-stone-100 text-stone-600 rounded-2xl font-bold hover:bg-stone-200">넘기기</button>
                  <button onClick={() => { bragOne(miniCandidates[miniIndex]); setTimeout(nextMini, 1200); }}
                    className="hand col-span-2 py-3 bg-gradient-to-r from-orange-400 to-pink-500 text-white rounded-2xl font-bold hover:shadow-lg">
                    💝 자랑하기
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}

        {mode === 'full' && (
          <div className="pop-in">
            <div className="flex items-center justify-between mb-4">
              <button onClick={() => setMode('home')} className="hand text-sm text-stone-500">← 홈으로</button>
              <div className="hand text-lg font-bold text-stone-800">전체 둘러보기</div>
              <div className="w-16"></div>
            </div>
            {students.length > 0 && (
              <div className="mb-4 flex flex-wrap items-center gap-3 bg-white/60 p-3 rounded-2xl">
                <input type="text" placeholder="🔍 이름 검색" value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                  className="dodum flex-1 min-w-[200px] px-4 py-2 border border-stone-200 rounded-full text-sm bg-white" />
                <select value={classFilter} onChange={e => setClassFilter(e.target.value)}
                  className="dodum px-4 py-2 border border-stone-200 rounded-full text-sm bg-white">
                  {classes.map(c => <option key={c} value={c}>{c === '전체' ? '전체 반' : c + '반'}</option>)}
                </select>
                <div className="hand text-sm text-stone-700">선택 <span className="text-orange-600 font-bold">{selectedIds.size}</span>명</div>
              </div>
            )}
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 mb-6">
              {filteredStudents.map(student => (
                <StudentCard key={student.id} student={student} isSelected={selectedIds.has(student.id)}
                  onToggle={() => toggleSelect(student.id)} onPhotoUpload={(file) => handlePhotoUpload(student.id, file)}
                  onRemove={() => removeStudent(student.id)} />
              ))}
            </div>
            {selectedIds.size > 0 && (
              <div className="sticky bottom-4 bg-white rounded-3xl card-shadow p-5 pop-in border-2 border-orange-300">
                <div className="flex flex-wrap items-center gap-3">
                  <div className="flex-1 min-w-[200px]">
                    <div className="hand text-base font-bold text-stone-800 mb-1">{selectedIds.size}명을 자랑하려 해요 ✨</div>
                    <input type="text" placeholder="한 줄 자랑 (선택)" value={reason} onChange={e => setReason(e.target.value)}
                      className="dodum w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-sm" />
                  </div>
                  <button onClick={submitBrag} className="hand bg-gradient-to-r from-orange-400 to-pink-500 text-white px-6 py-3 rounded-full font-bold hover:shadow-lg">
                    💝 자랑하기
                  </button>
                </div>
              </div>
            )}
          </div>
        )}

        {mode === 'dashboard' && (
          <div className="pop-in">
            <div className="mb-6">
              <div className="hand text-3xl font-bold text-stone-800 mb-1">우리 학교 자랑 현황</div>
              <div className="dodum text-sm text-stone-500">{currentWeek} · 실시간 업데이트</div>
            </div>
            <div className="grid md:grid-cols-4 gap-3 mb-6">
              <BigStat emoji="🎉" label="누적 자랑" value={stats.total} />
              <BigStat emoji="📅" label="이번 주" value={stats.thisWeek} accent />
              <BigStat emoji="👩‍🏫" label="참여 선생님" value={stats.totalTeachers} />
              <BigStat emoji="🌟" label="자랑받은 학생" value={stats.uniqueStudents} />
            </div>
            {stats.topStudents.length > 0 && (
              <div className="bg-white rounded-3xl p-6 card-shadow mb-6">
                <div className="hand text-xl font-bold text-stone-800 mb-4">🏆 가장 많이 자랑받은 학생들</div>
                <div className="space-y-3">
                  {stats.topStudents.map((s, idx) => (
                    <div key={idx} className="flex items-center gap-4 p-3 bg-gradient-to-r from-orange-50 to-pink-50 rounded-2xl">
                      <div className="hand text-2xl font-bold text-orange-500 w-8">{idx + 1}</div>
                      <div className="flex-1">
                        <div className="hand text-lg font-bold text-stone-800">{s.name}</div>
                        <div className="dodum text-xs text-stone-500">{s.class}</div>
                      </div>
                      <div className="hand text-sm font-bold text-stone-700">{s.count}번</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
            {recommendationLog.length > 0 && (
              <div className="bg-white rounded-3xl p-6 card-shadow mb-6">
                <div className="flex items-center justify-between mb-4">
                  <div className="hand text-xl font-bold text-stone-800">최근 자랑 내역</div>
                  <button onClick={downloadCSV} className="hand text-sm bg-stone-800 text-white px-4 py-2 rounded-full">📥 CSV</button>
                </div>
                <div className="space-y-2 max-h-96 overflow-y-auto">
                  {recommendationLog.slice(0, 20).map((r, idx) => (
                    <div key={idx} className="flex items-start gap-3 p-3 border-b border-stone-100 last:border-0">
                      <div className="text-2xl">💝</div>
                      <div className="flex-1">
                        <div className="dodum text-sm">
                          <span className="font-bold text-stone-700">{r.teacher}</span> 선생님이{' '}
                          <span className="font-bold text-orange-600">{r.studentName}</span>
                          {r.class && <span className="text-stone-500 text-xs"> ({r.class})</span>}
                          <span className="text-stone-600">을(를) 자랑했어요</span>
                        </div>
                        {r.reason && <div className="hand text-sm text-stone-600 mt-1">💬 "{r.reason}"</div>}
                        <div className="text-xs text-stone-400 mt-1">{r.timestamp}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
            {recommendationLog.length === 0 && (
              <div className="bg-white/60 rounded-3xl p-12 text-center">
                <div className="text-6xl mb-4">🌱</div>
                <div className="hand text-xl text-stone-600 mb-2">아직 자랑 내역이 없어요</div>
                <button onClick={() => setMode('home')} className="hand bg-orange-500 text-white px-6 py-3 rounded-full mt-2">첫 자랑 시작하기</button>
              </div>
            )}
          </div>
        )}

        {mode === 'manage' && (
          <div className="pop-in">
            <div className="hand text-3xl font-bold text-stone-800 mb-4">학생 명단 관리</div>
            <div className="bg-white rounded-3xl p-5 card-shadow mb-5">
              <div className="flex flex-wrap gap-3 mb-4">
                <button onClick={() => csvInputRef.current?.click()} className="hand bg-stone-800 text-white px-4 py-2.5 rounded-full text-sm">📤 CSV 업로드</button>
                <input ref={csvInputRef} type="file" accept=".csv" onChange={handleCSVUpload} className="hidden" />
                <button onClick={downloadTemplate} className="hand border-2 border-stone-200 px-4 py-2.5 rounded-full text-sm">📋 템플릿</button>
                <button onClick={loadSampleData} className="hand border-2 border-stone-200 px-4 py-2.5 rounded-full text-sm">샘플 추가</button>
                {students.length > 0 && (
                  <button onClick={() => { if (confirm('모두 삭제?')) { setStudents([]); setSelectedIds(new Set()); } }}
                    className="hand text-red-600 border-2 border-red-200 px-4 py-2.5 rounded-full text-sm ml-auto">🗑 전체 삭제</button>
                )}
              </div>
              {csvError && <div className="text-sm text-red-700 dodum">⚠️ {csvError}</div>}
              <div className="hand text-sm text-stone-600">전체 <span className="font-bold text-stone-900">{students.length}</span>명 등록됨</div>
            </div>
            {students.length === 0 ? (
              <div className="bg-white/60 rounded-3xl p-12 text-center">
                <div className="text-6xl mb-4">👥</div>
                <div className="hand text-xl text-stone-600 mb-2">학생 명단이 비어있어요</div>
                <div className="dodum text-sm text-stone-500">CSV를 업로드하거나 샘플로 시작해보세요</div>
              </div>
            ) : (
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                {filteredStudents.map(student => (
                  <StudentCard key={student.id} student={student} isSelected={false} onToggle={() => {}}
                    onPhotoUpload={(file) => handlePhotoUpload(student.id, file)} onRemove={() => removeStudent(student.id)} manageMode />
                ))}
              </div>
            )}
          </div>
        )}
      </main>
      <footer className="py-8 text-center text-xs text-stone-500 dodum">
        우리반 자랑하기 · 브라우저에서만 처리되는 안전한 데이터
      </footer>
    </div>
  );
}

function NavBtn({ active, onClick, emoji, label }) {
  return (
    <button onClick={onClick} className={`flex items-center gap-1.5 px-3 py-2 rounded-full text-sm hand transition ${active ? 'bg-stone-800 text-white' : 'text-stone-600 hover:bg-white/60'}`}>
      <span>{emoji}</span>
      <span className="hidden sm:inline">{label}</span>
    </button>
  );
}
function MiniStat({ icon, value, label }) {
  return (
    <div className="text-center">
      <div className="text-2xl mb-1">{icon}</div>
      <div className="hand text-2xl font-bold text-stone-800">{value}</div>
      <div className="dodum text-[11px] text-stone-500 leading-tight">{label}</div>
    </div>
  );
}
function BigStat({ emoji, label, value, accent }) {
  return (
    <div className={`${accent ? 'bg-gradient-to-br from-orange-400 to-pink-500 text-white' : 'bg-white text-stone-800'} rounded-3xl p-5 card-shadow`}>
      <div className="text-3xl mb-2">{emoji}</div>
      <div className={`dodum text-xs ${accent ? 'text-white/80' : 'text-stone-500'} mb-1`}>{label}</div>
      <div className="hand text-4xl font-bold">{value}</div>
    </div>
  );
}
function StudentCard({ student, isSelected, onToggle, onPhotoUpload, onRemove, manageMode }) {
  const photoInputRef = useRef(null);
  const handlePhotoClick = (e) => { e.stopPropagation(); photoInputRef.current?.click(); };
  const handleFileChange = (e) => { const file = e.target.files[0]; if (file) onPhotoUpload(file); if (photoInputRef.current) photoInputRef.current.value = ''; };
  return (
    <div onClick={manageMode ? undefined : onToggle}
      className={`relative bg-white rounded-2xl overflow-hidden hover-lift ${manageMode ? '' : 'cursor-pointer'} ${isSelected ? 'ring-4 ring-orange-400' : ''}`}>
      {isSelected && (
        <div className="absolute top-2 right-2 w-7 h-7 bg-orange-500 text-white flex items-center justify-center rounded-full z-10 pop-in font-bold">✓</div>
      )}
      <div className="aspect-square bg-gradient-to-br from-orange-50 to-pink-50 relative group">
        {student.photo ? (
          <img src={student.photo} alt={student.name} className="w-full h-full object-cover" onError={(e) => { e.target.style.display = 'none'; }} />
        ) : (
          <div className="w-full h-full flex items-center justify-center text-stone-300" style={{fontSize: '60px'}}>👤</div>
        )}
        <button onClick={handlePhotoClick} className="absolute bottom-2 left-2 bg-black/60 text-white text-xs px-2 py-1 rounded-full hand opacity-0 group-hover:opacity-100 transition">📷 사진</button>
        <button onClick={(e) => { e.stopPropagation(); onRemove(); }} className="absolute top-2 left-2 w-6 h-6 bg-black/60 text-white flex items-center justify-center rounded-full opacity-0 group-hover:opacity-100 transition hover:bg-red-600">✕</button>
        <input ref={photoInputRef} type="file" accept="image/*" onChange={handleFileChange} className="hidden" />
      </div>
      <div className="p-2.5">
        <div className="hand text-base font-bold text-stone-800 truncate">{student.name}</div>
        <div className="dodum text-[11px] text-stone-500">
          {student.class}{student.class && student.number && ' · '}{student.number && `${student.number}번`}
          {!student.class && !student.number && <span className="text-stone-400">정보 없음</span>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
