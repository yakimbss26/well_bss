  body { margin: 0; }

  .sans { font-family: 'Noto Sans KR', sans-serif; }
  .dodum { font-family: 'Gowun Dodum', sans-serif; }

  @keyframes popIn { 0% { opacity: 0; transform: scale(0.96); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes celebrate { 0% { transform: scale(0.5); opacity: 0; } 50% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes slideUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
  @keyframes shimmer { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
  .pop-in { animation: popIn 0.3s ease-out; }
  .celebrate { animation: celebrate 0.6s ease-out; }
  .slide-up { animation: slideUp 0.4s ease-out; }
  .shimmer { animation: shimmer 2s ease-in-out infinite; }

  .glass {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

  .hover-lift { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
  .hover-lift:hover { transform: translateY(-3px); box-shadow: 0 12px 28px -10px rgba(30, 58, 138, 0.4); }

  .school-bg {
    background-image: 
      linear-gradient(180deg, rgba(241, 245, 249, 0.90) 0%, rgba(219, 234, 254, 0.86) 50%, rgba(191, 219, 254, 0.90) 100%),

    background-size: cover;

  .school-bg-fallback {
    background: linear-gradient(180deg, #eff6ff 0%, #dbeafe 50%, #bfdbfe 100%);
  }

  .dept-character { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); }
  .dept-class { background: linear-gradient(135deg, #0891b2 0%, #0e7490 100%); }
  .dept-service { background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); }
</style>

<body>
<div id="root"></div>

<script type="text/babel" data-type="module">
const { useState, useMemo, useRef, useEffect } = React;

const ADMIN_PASSWORD = 'bss1004';

// ===== 월별 인성 교육 목표 (자동 적용) =====
const MONTHLY_GOALS = {
  3: {

  },

  },

  },
  7: {

    tags: ['봉사 정신이 빛나요', '헌신적으로 참여해요', '공동체를 챙겨요', '솔선수범 봉사해요', '학교를 위해 노력해요'],
  },
  8: {
    title: '공동체를 위해 봉사하고 헌신하는 시간 할애하기',
    emoji: '✋',
    tags: ['봉사 정신이 빛나요', '헌신적으로 참여해요', '공동체를 챙겨요', '솔선수범 봉사해요', '학교를 위해 노력해요'],
  },
  9: {
    title: '늘 성실한 자세로 책임감 있는 수업 자세 가지기',
    emoji: '📚',
    tags: ['수업 태도가 좋아요', '성실하게 임해요', '책임감이 강해요', '끝까지 집중해요', '준비성이 철저해요'],
  },
  10: {

    emoji: '🌿',
    tags: ['공간을 깔끔히 써요', '타인을 배려해요', '조용히 행동해요', '공용물을 아껴 써요', '함께 쓰는 곳을 챙겨요'],
  },
  11: {
    title: '타인의 성공을 축하하고 실패를 위로하는 공감 능력',
    emoji: '🎈',
    tags: ['친구의 성공을 축하해요', '위로를 잘 건네요', '공감 능력이 뛰어나요', '함께 기뻐해줘요', '감정을 잘 헤아려요'],
  },
  12: {
    title: '주변 환경을 깨끗하게 / 공동체 환경 정비',
    emoji: '🧹',
    tags: ['청소를 잘해요', '주변을 깨끗하게 해요', '환경 정비에 솔선수범', '뒷정리를 잘해요', '교실을 가꿔요'],
  },
};

const ALL_MONTHS = [3, 4, 5, 6, 7, 9, 10, 11, 12];

const CATEGORIES = {
  character: {
    label: '인성 실천',
    short: '인성',
    description: '월별 인성 목표 실천 또는 예의·배려·공동체 의식 실천 학생',
    recommender: '전 교사',
    icon: '🌱',
  },
  class: {
    label: '학급 공동체',
    short: '학급',
    description: '학급 활동에 책임감 있게 참여, 희생·봉사·청소에 솔선수범한 학생',
    recommender: '담임 교사',
    icon: '🤝',
  },
  service: {
    label: '학교 봉사 및 기여',
    short: '봉사',
    description: '학기당 20시간 이상 봉사활동 (방송부, 운영지원, 재능기부 등)',
    recommender: '담당 교사',
    icon: '✨',
  },
};

function App() {
  const [students, setStudents] = useState(() => {
    try {
      const saved = localStorage.getItem('bss_students');
      if (saved) return JSON.parse(saved);
    } catch {}
    return typeof INITIAL_STUDENTS !== 'undefined' ? INITIAL_STUDENTS : [];
  });

  const [recommendationLog, setRecommendationLog] = useState(() => {
    try { return JSON.parse(localStorage.getItem('bss_log') || '[]'); } catch { return []; }
  });

  const [teacherName, setTeacherName] = useState(() => localStorage.getItem('bss_teacher') || '');
  const [selectedIds, setSelectedIds] = useState(new Set());
  const [category, setCategory] = useState('character');
  const [reason, setReason] = useState('');
  const [searchQuery, setSearchQuery] = useState('');
  const [gradeFilter, setGradeFilter] = useState('전체');
  const [classFilter, setClassFilter] = useState('전체');
  const [mode, setMode] = useState('home');
  const [miniIndex, setMiniIndex] = useState(0);
  const [miniCandidates, setMiniCandidates] = useState([]);
  const [justBragged, setJustBragged] = useState(null);
  const [isAdminUnlocked, setIsAdminUnlocked] = useState(false);
  const [showPwModal, setShowPwModal] = useState(false);
  const [pwInput, setPwInput] = useState('');
  const [pwError, setPwError] = useState('');
  const [showInstall, setShowInstall] = useState(false);
  const [showMonthCalendar, setShowMonthCalendar] = useState(false);
  const csvInputRef = useRef(null);

  useEffect(() => { localStorage.setItem('bss_students', JSON.stringify(students)); }, [students]);
  useEffect(() => { localStorage.setItem('bss_log', JSON.stringify(recommendationLog)); }, [recommendationLog]);
  useEffect(() => { localStorage.setItem('bss_teacher', teacherName); }, [teacherName]);

  // ===== 현재 월에 따라 자동 변경 =====
  const currentMonth = new Date().getMonth() + 1;
  const currentMonthData = MONTHLY_GOALS[currentMonth] || { title: '바른 인재상', emoji: '🌟', tags: ['예의가 발라요', '책임감이 강해요'] };
  const currentMonthGoal = currentMonthData.title;
  const currentMonthEmoji = currentMonthData.emoji;
  const currentMonthTags = currentMonthData.tags;
  
  const getWeekKey = (date = new Date()) => {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + 4 - (d.getDay() || 7));
    const yearStart = new Date(d.getFullYear(), 0, 1);
    const weekNo = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
    return `${d.getFullYear()}-W${String(weekNo).padStart(2, '0')}`;
  };
  const currentWeek = getWeekKey();

  const requireAdmin = (callback) => {
    if (isAdminUnlocked) { callback(); return; }
    setShowPwModal(true);
    setPwInput(''); setPwError('');
    window._pendingAdminAction = callback;
  };

  const submitPassword = () => {
    if (pwInput === ADMIN_PASSWORD) {
      setIsAdminUnlocked(true);
      setShowPwModal(false);
      setPwError('');
      if (window._pendingAdminAction) {
        window._pendingAdminAction();
        window._pendingAdminAction = null;
      }
      setTimeout(() => setIsAdminUnlocked(false), 30 * 60 * 1000);
    } else {
      setPwError('비밀번호가 일치하지 않습니다.');
      setPwInput('');
    }
  };

  const parseCSV = (text) => {
    const lines = text.trim().split(/\r?\n/);
    if (lines.length < 2) return [];
    const parseLine = (line) => {
      const result = []; let current = ''; let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') inQuotes = !inQuotes;
        else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
        else current += char;
      }
      result.push(current.trim());
      return result;
    };
    const headers = parseLine(lines[0]).map(h => h.replace(/^"|"$/g, ''));
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      const values = parseLine(lines[i]).map(v => v.replace(/^"|"$/g, ''));
      const row = {};
      headers.forEach((h, idx) => { row[h] = values[idx] || ''; });
      rows.push(row);
    }
    return rows;
  };

  const handleCSVUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const rows = parseCSV(event.target.result);
        const newStudents = rows.map((row, idx) => {
          const grade = parseInt(row['학년'] || row['grade'] || '0');
          const cls = parseInt(row['반'] || row['class'] || '0');
          const number = parseInt(row['번호'] || row['no'] || '0');
          const sno = parseInt(row['학번'] || row['sno'] || `${grade}${cls}${String(number).padStart(2,'0')}`);
          return {
            id: `std_${sno}_${Date.now()}_${idx}`,
            name: row['이름'] || row['name'] || '',
            grade, class: cls, number, sno,
            teacher: row['담임'] || row['teacher'] || '',
            photo: (row['사진'] || row['photo'] || '').trim(),
          };
        }).filter(s => s.name);
        setStudents(prev => [...prev, ...newStudents]);
        if (csvInputRef.current) csvInputRef.current.value = '';
        alert(`${newStudents.length}명 추가됨`);
      } catch (err) { alert('CSV 파싱 오류: ' + err.message); }
    };
    reader.readAsText(file, 'UTF-8');
  };

  const handlePhotoUpload = (studentId, file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxSize = 400;
        let w = img.width, h = img.height;
        if (w > h) { if (w > maxSize) { h = h * maxSize / w; w = maxSize; } }
        else { if (h > maxSize) { w = w * maxSize / h; h = maxSize; } }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const compressed = canvas.toDataURL('image/jpeg', 0.85);
        setStudents(prev => prev.map(s => s.id === studentId ? { ...s, photo: compressed } : s));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  };

  const removeStudent = (id) => {
    if (!confirm('이 학생을 삭제하시겠습니까?')) return;
    setStudents(prev => prev.filter(s => s.id !== id));
    setSelectedIds(prev => { const n = new Set(prev); n.delete(id); return n; });
  };

  const updateStudent = (id, updates) => {
    setStudents(prev => prev.map(s => s.id === id ? { ...s, ...updates } : s));
  };

  const filteredStudents = useMemo(() => {
    return students.filter(s => {
      const matchGrade = gradeFilter === '전체' || String(s.grade) === gradeFilter;
      const matchClass = classFilter === '전체' || String(s.class) === classFilter;
      const matchSearch = !searchQuery ||
        s.name.includes(searchQuery) ||
        String(s.sno).includes(searchQuery) ||
        (s.teacher && s.teacher.includes(searchQuery));
      return matchGrade && matchClass && matchSearch;
    });
  }, [students, searchQuery, gradeFilter, classFilter]);

  const availableClasses = useMemo(() => {
    const set = new Set(students.filter(s => gradeFilter === '전체' || String(s.grade) === gradeFilter).map(s => s.class).filter(Boolean));
    return ['전체', ...Array.from(set).sort((a, b) => a - b).map(String)];
  }, [students, gradeFilter]);

  const toggleSelect = (id) => {
    setSelectedIds(prev => { const n = new Set(prev); if (n.has(id)) n.delete(id); else n.add(id); return n; });
  };

  const startMiniMode = () => {
    if (!teacherName.trim()) { alert('먼저 선생님 성함을 입력해주세요.'); return; }
    if (students.length === 0) { alert('학생 명단이 없습니다.'); return; }
    const shuffled = [...students].sort(() => Math.random() - 0.5);
    setMiniCandidates(shuffled.slice(0, Math.min(12, students.length)));
    setMiniIndex(0);
    setMode('mini');
  };

  const bragOne = (student, quickReason = '') => {
    const entry = {
      timestamp: new Date().toLocaleString('ko-KR'),
      week: currentWeek, month: currentMonth,
      monthGoal: currentMonthGoal,
      teacher: teacherName.trim(),
      studentId: student.id, studentName: student.name,
      grade: student.grade, class: student.class,
      number: student.number, sno: student.sno,
      category, reason: quickReason || reason.trim(),
      mode: 'mini',
    };
    setRecommendationLog(prev => [entry, ...prev]);
    setJustBragged(student);
    setTimeout(() => setJustBragged(null), 1300);
  };

  const skipMini = () => {
    if (miniIndex < miniCandidates.length - 1) setMiniIndex(miniIndex + 1);
    else { setMode('home'); setReason(''); }
  };
  const nextMini = () => {
    if (miniIndex < miniCandidates.length - 1) { setMiniIndex(miniIndex + 1); setReason(''); }
    else { setMode('home'); setReason(''); alert('이번 주 추천 완료! 고생하셨습니다.'); }
  };

  const submitBatch = () => {
    if (selectedIds.size === 0) return alert('추천할 학생을 선택해주세요.');
    if (!teacherName.trim()) return alert('선생님 성함을 입력해주세요.');
    const selected = students.filter(s => selectedIds.has(s.id));
    const entries = selected.map(s => ({
      timestamp: new Date().toLocaleString('ko-KR'),
      week: currentWeek, month: currentMonth,
      monthGoal: currentMonthGoal,
      teacher: teacherName.trim(),
      studentId: s.id, studentName: s.name,
      grade: s.grade, class: s.class,
      number: s.number, sno: s.sno,
      category, reason: reason.trim(),
      mode: 'full',
    }));
    setRecommendationLog(prev => [...entries, ...prev]);
    setSelectedIds(new Set());
    setReason('');
    alert(`${selected.length}명 추천 완료`);
  };

  const downloadCSV = () => {
    if (recommendationLog.length === 0) return alert('다운로드할 내역이 없습니다.');
    const headers = ['추천일시', '주차', '월', '월별목표', '추천교사', '추천부문', '학년', '반', '번호', '학번', '학생이름', '추천사유', '입력모드'];
    const rows = recommendationLog.map(r => [
      r.timestamp, r.week, r.month + '월', r.monthGoal || '', r.teacher,
      CATEGORIES[r.category]?.label || r.category,
      r.grade ? r.grade + '학년' : '',
      r.class || '', r.number || '', r.sno || '',
      r.studentName, r.reason || '', r.mode,
    ]);
    const csv = [headers, ...rows].map(row => row.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `바른인재추천_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
    URL.revokeObjectURL(url);
  };

  const downloadStudentTemplate = () => {
    const tpl = '학년,반,번호,학번,이름,담임,사진\n1,1,1,1101,홍길동,유혜빈,\n';
    const blob = new Blob(['\uFEFF' + tpl], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = '학생명단_템플릿.csv';
    link.click();
    URL.revokeObjectURL(url);
  };

  const stats = useMemo(() => {
    const thisWeek = recommendationLog.filter(r => r.week === currentWeek);
    const thisMonth = recommendationLog.filter(r => r.month === currentMonth);
    const uniqueTeachers = new Set(recommendationLog.map(r => r.teacher));
    const thisMonthTeachers = new Set(thisMonth.map(r => r.teacher));
    const uniqueStudents = new Set(recommendationLog.map(r => r.studentId || r.studentName));

    const studentCount = {};
    recommendationLog.forEach(r => {
      const key = r.studentId || `${r.grade}_${r.class}_${r.studentName}`;
      if (!studentCount[key]) {
        studentCount[key] = { name: r.studentName, grade: r.grade, class: r.class, count: 0, categories: {} };
      }
      studentCount[key].count++;
      studentCount[key].categories[r.category] = (studentCount[key].categories[r.category] || 0) + 1;
    });
    const topStudents = Object.values(studentCount).sort((a, b) => b.count - a.count).slice(0, 10);

    const byCategory = { character: 0, class: 0, service: 0 };
    recommendationLog.forEach(r => { if (byCategory[r.category] !== undefined) byCategory[r.category]++; });

    const byMonth = {};
    recommendationLog.forEach(r => {
      const m = r.month || new Date(r.timestamp).getMonth() + 1;
      byMonth[m] = (byMonth[m] || 0) + 1;
    });

    return {
      total: recommendationLog.length, thisWeek: thisWeek.length, thisMonth: thisMonth.length,
      totalTeachers: uniqueTeachers.size, thisMonthTeachers: thisMonthTeachers.size,
      uniqueStudents: uniqueStudents.size, topStudents, byCategory, byMonth,
    };

                    <div className="text-2xl mb-1">{cat.icon}</div>
                    <div className="dodum text-xs opacity-90">{cat.label}</div>
                    <div className="myeongjo text-3xl font-bold mt-1">{stats.byCategory[key]}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* 월별 추천 통계 */}
            <div className="bg-white rounded-2xl p-5 card-shadow mb-6">
              <div className="myeongjo text-lg font-bold text-slate-800 mb-3">📅 월별 추천 현황</div>
              <div className="grid grid-cols-3 md:grid-cols-5 gap-2">
                {ALL_MONTHS.map(m => {
                  const g = MONTHLY_GOALS[m];
                  const cnt = stats.byMonth[m] || 0;
                  const isCurrent = m === currentMonth;
                  return (
                    <div key={m} className={`p-3 rounded-xl text-center ${isCurrent ? 'dept-character text-white' : 'bg-slate-50'}`}>
                      <div className="text-xl">{g.emoji}</div>
                      <div className={`dodum text-xs font-bold ${isCurrent ? '' : 'text-slate-600'}`}>
                        {m === 7 ? '7~8월' : m + '월'}
                      </div>
                      <div className={`myeongjo text-xl font-bold ${isCurrent ? '' : 'text-slate-800'}`}>{cnt}</div>
                    </div>
                  );
                })}
              </div>
            </div>

            {stats.topStudents.length > 0 && (
              <div className="bg-white rounded-2xl p-5 card-shadow mb-6">
                <div className="myeongjo text-lg font-bold text-slate-800 mb-3">🏆 가장 많이 추천받은 학생</div>
                <div className="space-y-2">
                  {stats.topStudents.map((s, idx) => (
                    <div key={idx} className="flex items-center gap-3 p-3 bg-gradient-to-r from-blue-50 to-cyan-50 rounded-xl">
                      <div className="myeongjo text-xl font-bold text-blue-700 w-8">{idx + 1}</div>
                      <div className="flex-1">
                        <div className="myeongjo text-base font-bold text-slate-800">{s.name}</div>
                        <div className="dodum text-xs text-slate-500">{s.grade}학년 {s.class}반</div>
                      </div>
                      <div className="dodum text-sm font-bold text-slate-700">{s.count}회</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {recommendationLog.length > 0 && (
              <div className="bg-white rounded-2xl p-5 card-shadow mb-6">
                <div className="flex items-center justify-between mb-3">
                  <div className="myeongjo text-lg font-bold text-slate-800">최근 추천 내역</div>
                  <button onClick={downloadCSV} className="dodum text-sm bg-slate-800 text-white px-4 py-2 rounded-full">📥 CSV</button>
                </div>
                <div className="space-y-2 max-h-96 overflow-y-auto">
                  {recommendationLog.slice(0, 30).map((r, idx) => (
                    <div key={idx} className="flex items-start gap-3 p-3 border-b border-slate-100 last:border-0">
                      <div className="text-2xl">{CATEGORIES[r.category]?.icon || '💝'}</div>
                      <div className="flex-1">
                        <div className="dodum text-sm">
                          <span className="font-bold text-slate-700">{r.teacher}</span> 선생님이{' '}
                          <span className="font-bold text-blue-700">{r.studentName}</span>
                          {r.grade && <span className="text-slate-500 text-xs"> ({r.grade}-{r.class})</span>}
                          {' '}학생을 <span className="font-bold">{CATEGORIES[r.category]?.label || ''}</span>으로 추천
                        </div>
                        {r.reason && <div className="dodum text-sm text-slate-600 mt-1">💬 "{r.reason}"</div>}
                        <div className="text-xs text-slate-400 mt-1">
                          {r.timestamp}
                          {r.monthGoal && <span className="ml-2 text-blue-500">· {r.monthGoal}</span>}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {recommendationLog.length === 0 && (
              <div className="glass rounded-2xl p-12 text-center">
                <div className="text-6xl mb-4">🌱</div>
                <div className="myeongjo text-xl text-slate-600 mb-2">아직 추천 내역이 없습니다</div>
                <button onClick={() => setMode('home')} className="dodum dept-character text-white px-6 py-3 rounded-full mt-2 font-bold">
                  첫 추천 시작하기
                </button>
              </div>
            )}
          </div>
        )}

        {mode === 'manage' && (
          <div className="pop-in">
            <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-2xl">🔓</span>
                  <div className="myeongjo text-2xl font-bold text-slate-800">학생 명단 관리</div>
                </div>
                <div className="dodum text-sm text-slate-500">전체 {students.length}명 · 관리자 모드</div>
              </div>
              <button onClick={() => { setIsAdminUnlocked(false); setMode('home'); }}
                className="dodum text-xs px-3 py-2 bg-slate-200 text-slate-700 rounded-full hover:bg-slate-300">
                🔒 잠그기
              </button>
            </div>

            <div className="bg-white rounded-2xl p-5 card-shadow mb-5">
              <div className="flex flex-wrap gap-2 mb-3">
                <button onClick={() => csvInputRef.current?.click()} className="dodum bg-slate-800 text-white px-4 py-2.5 rounded-full text-sm">📤 CSV 업로드</button>
                <input ref={csvInputRef} type="file" accept=".csv" onChange={handleCSVUpload} className="hidden" />
                <button onClick={downloadStudentTemplate} className="dodum border-2 border-slate-200 px-4 py-2.5 rounded-full text-sm">📋 템플릿 받기</button>
                <button onClick={() => { if (confirm('전체 명단을 초기값으로 되돌리시겠습니까? 사진/수정사항이 모두 사라집니다.')) { setStudents(INITIAL_STUDENTS); }}}
                  className="dodum border-2 border-blue-200 text-blue-700 px-4 py-2.5 rounded-full text-sm">🔄 초기값 복원</button>
                <button onClick={() => { if (confirm('전체 학생을 삭제할까요?')) setStudents([]); }}
                  className="dodum text-red-600 border-2 border-red-200 px-4 py-2.5 rounded-full text-sm ml-auto">🗑 전체 삭제</button>
              </div>
              <div className="flex flex-wrap items-center gap-2">
                <input type="text" placeholder="🔍 이름 검색" value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                  className="dodum flex-1 min-w-[150px] px-4 py-2 border border-slate-200 rounded-full text-sm" />
                <select value={gradeFilter} onChange={e => { setGradeFilter(e.target.value); setClassFilter('전체'); }}
                  className="dodum px-3 py-2 border border-slate-200 rounded-full text-sm bg-white">
                  <option value="전체">전체 학년</option>
                  <option value="1">1학년</option>
                  <option value="2">2학년</option>
                  <option value="3">3학년</option>
                </select>
                <select value={classFilter} onChange={e => setClassFilter(e.target.value)}
                  className="dodum px-3 py-2 border border-slate-200 rounded-full text-sm bg-white">
                  {availableClasses.map(c => <option key={c} value={c}>{c === '전체' ? '전체 반' : c + '반'}</option>)}
                </select>
              </div>
              <div className="dodum text-xs text-slate-500 mt-3 leading-relaxed">
                💡 학생 카드에 마우스를 올리면 사진 변경, 정보 수정, 삭제 버튼이 나타납니다.
              </div>
            </div>

            {students.length === 0 ? (
              <div className="glass rounded-2xl p-12 text-center">
                <div className="text-6xl mb-4">👥</div>
                <div className="myeongjo text-xl text-slate-600 mb-2">학생 명단이 없습니다</div>
                <div className="dodum text-sm text-slate-500 mb-4">초기값 복원 또는 CSV 업로드로 시작하세요</div>
              </div>
            ) : (
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                {filteredStudents.map(student => (
                  <StudentCard key={student.id} student={student} isSelected={false} onToggle={() => {}}
                    onPhotoUpload={(file) => handlePhotoUpload(student.id, file)}
                    onRemove={() => removeStudent(student.id)}
                    canManage={true} manageMode
                    onEdit={(updates) => updateStudent(student.id, updates)} />
                ))}
              </div>
            )}
          </div>
        )}
      </main>

      <footer className="py-8 text-center text-xs text-slate-500 dodum">
        부산과학고등학교 · 바른인재 발굴 프로젝트 · 2026학년도
        <br/>
        <span className="text-slate-400">데이터는 브라우저에 안전하게 저장됩니다</span>
      </footer>
    </div>
  );
}

function NavBtn({ active, onClick, emoji, label }) {
  return (
    <button onClick={onClick} className={`flex items-center gap-1.5 px-3 py-2 rounded-full text-sm dodum transition ${active ? 'bg-slate-800 text-white' : 'text-slate-700 hover:bg-white/60'}`}>
      <span>{emoji}</span>
      <span className="hidden sm:inline">{label}</span>
    </button>
  );
}

function MiniStat({ icon, value, label }) {
  return (
    <div className="text-center">
      <div className="text-xl mb-1">{icon}</div>
      <div className="myeongjo text-2xl font-bold text-slate-800">{value}</div>
      <div className="dodum text-[11px] text-slate-500 leading-tight">{label}</div>
    </div>
  );
}

function BigStat({ emoji, label, value, accent }) {
  return (
    <div className={`${accent ? 'dept-character text-white' : 'bg-white text-slate-800'} rounded-2xl p-5 card-shadow`}>
      <div className="text-3xl mb-2">{emoji}</div>
      <div className={`dodum text-xs ${accent ? 'text-white/80' : 'text-slate-500'} mb-1`}>{label}</div>
      <div className="myeongjo text-4xl font-bold">{value}</div>
    </div>
  );
}

function StudentCard({ student, isSelected, onToggle, onPhotoUpload, onRemove, canManage, manageMode, onEdit }) {
  const photoInputRef = useRef(null);
  const [editing, setEditing] = useState(false);
  const [editData, setEditData] = useState({
    name: student.name, grade: student.grade,
    class: student.class, number: student.number, teacher: student.teacher || ''
  });

  const handlePhotoClick = (e) => { e.stopPropagation(); photoInputRef.current?.click(); };
  const handleFileChange = (e) => { const file = e.target.files[0]; if (file) onPhotoUpload(file); if (photoInputRef.current) photoInputRef.current.value = ''; };

  const saveEdit = () => {
    if (onEdit) {
      onEdit({
        name: editData.name,
        grade: parseInt(editData.grade) || student.grade,
        class: parseInt(editData.class) || student.class,
        number: parseInt(editData.number) || student.number,
        teacher: editData.teacher,
      });
    }
    setEditing(false);
  };

  return (
    <div onClick={manageMode ? undefined : onToggle}
      className={`relative bg-white rounded-xl overflow-hidden hover-lift ${manageMode ? '' : 'cursor-pointer'} ${isSelected ? 'ring-4 ring-blue-500' : ''}`}>
      {isSelected && (
        <div className="absolute top-2 right-2 w-7 h-7 bg-blue-600 text-white flex items-center justify-center rounded-full z-10 pop-in font-bold">✓</div>
      )}
      <div className="aspect-square bg-gradient-to-br from-blue-50 to-cyan-50 relative group">
        {student.photo ? (
          <img src={student.photo} alt={student.name} className="w-full h-full object-cover" onError={(e) => { e.target.style.display = 'none'; }} />
        ) : (
          <div className="w-full h-full flex items-center justify-center text-blue-200" style={{fontSize: '50px'}}>👤</div>
        )}
        <div className="absolute top-2 left-2 dodum text-[10px] bg-black/60 text-white px-2 py-0.5 rounded-full">
          {student.grade}-{student.class}-{String(student.number).padStart(2, '0')}
        </div>
        {canManage && (
          <>
            <button onClick={handlePhotoClick} className="absolute bottom-2 left-2 bg-black/60 text-white text-xs px-2 py-1 rounded-full dodum opacity-0 group-hover:opacity-100 transition">
              📷 사진
            </button>
            {manageMode && (
              <button onClick={(e) => { e.stopPropagation(); setEditing(true); }} className="absolute bottom-2 right-2 bg-blue-600/80 text-white text-xs px-2 py-1 rounded-full dodum opacity-0 group-hover:opacity-100 transition">
                ✏️ 수정
              </button>
            )}
            <button onClick={(e) => { e.stopPropagation(); onRemove(); }} className="absolute top-7 left-2 w-6 h-6 bg-black/60 text-white flex items-center justify-center rounded-full opacity-0 group-hover:opacity-100 transition hover:bg-red-600">
              ✕
            </button>
          </>
        )}
        <input ref={photoInputRef} type="file" accept="image/*" onChange={handleFileChange} className="hidden" />
      </div>

      <div className="p-2.5">
        {editing ? (
          <div className="space-y-1" onClick={e => e.stopPropagation()}>
            <input value={editData.name} onChange={e => setEditData({...editData, name: e.target.value})} placeholder="이름"
              className="dodum w-full px-2 py-1 text-sm border border-slate-200 rounded" />
            <div className="flex gap-1">
              <input value={editData.grade} onChange={e => setEditData({...editData, grade: e.target.value})} placeholder="학년"
                className="dodum w-1/3 px-1 py-1 text-xs border border-slate-200 rounded" />
              <input value={editData.class} onChange={e => setEditData({...editData, class: e.target.value})} placeholder="반"
                className="dodum w-1/3 px-1 py-1 text-xs border border-slate-200 rounded" />
              <input value={editData.number} onChange={e => setEditData({...editData, number: e.target.value})} placeholder="번호"
                className="dodum w-1/3 px-1 py-1 text-xs border border-slate-200 rounded" />
            </div>
            <input value={editData.teacher} onChange={e => setEditData({...editData, teacher: e.target.value})} placeholder="담임"
              className="dodum w-full px-2 py-1 text-xs border border-slate-200 rounded" />
            <div className="flex gap-1">
              <button onClick={saveEdit} className="flex-1 dodum text-xs bg-blue-600 text-white py-1 rounded">저장</button>
              <button onClick={() => setEditing(false)} className="flex-1 dodum text-xs bg-slate-200 text-slate-700 py-1 rounded">취소</button>
            </div>
          </div>
        ) : (
          <>
            <div className="myeongjo text-base font-bold text-slate-800 truncate">{student.name}</div>
            <div className="dodum text-[11px] text-slate-500">
              {student.grade}학년 {student.class}반 · {student.number}번
            </div>
            {student.teacher && (
              <div className="dodum text-[10px] text-slate-400 truncate">담임 {student.teacher}</div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
