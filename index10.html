// ===== 설정 =====

const PHOTO_EXTENSIONS = ['jpg', 'jpeg', 'png', 'JPG', 'JPEG', 'PNG'];

// ===== 월별 인성 교육 목표 =====

  8: { title: '공동체를 위해 봉사하고 헌신하는 시간 할애하기', emoji: '✋',
    tags: ['봉사 정신이 빛나요', '헌신적으로 참여해요', '공동체를 챙겨요', '솔선수범 봉사해요', '학교를 위해 노력해요'] },
  9: { title: '늘 성실한 자세로 책임감 있는 수업 자세 가지기', emoji: '📚',

  11: { title: '타인의 성공을 축하하고 실패를 위로하는 공감 능력', emoji: '🎈',
    tags: ['친구의 성공을 축하해요', '위로를 잘 건네요', '공감 능력이 뛰어나요', '함께 기뻐해줘요', '감정을 잘 헤아려요'] },
  12: { title: '주변 환경을 깨끗하게 / 공동체 환경 정비', emoji: '🧹',
    tags: ['청소를 잘해요', '주변을 깨끗하게 해요', '환경 정비에 솔선수범', '뒷정리를 잘해요', '교실을 가꿔요'] },
};

const ALL_MONTHS = [3, 4, 5, 6, 7, 9, 10, 11, 12];

const CATEGORIES = {
  character: { label: '인성 실천', short: '인성',
    description: '월별 인성 목표 실천 또는 예의·배려·공동체 의식 실천 학생',
    recommender: '전 교사', icon: '🌱' },
  class: { label: '학급 공동체', short: '학급',
    description: '학급 활동에 책임감 있게 참여, 희생·봉사·청소에 솔선수범한 학생',
    recommender: '담임 교사', icon: '🤝' },
  service: { label: '학교 봉사 및 기여', short: '봉사',
    description: '학기당 20시간 이상 봉사활동 (방송부, 운영지원, 재능기부 등)',
    recommender: '담당 교사', icon: '✨' },
};

// 한글 부문명 → 코드 매핑 (시트 조회시 사용)
const CATEGORY_LABEL_TO_KEY = {
  '인성 실천': 'character',
  '학급 공동체': 'class',
  '학교 봉사 및 기여': 'service',
  'character': 'character',
  'class': 'class',
  'service': 'service',
};

// ===== Google Sheets API =====
async function postToSheets(entry) {
  try {
    // CORS 회피를 위해 no-cors mode 사용 (응답은 못 받지만 데이터는 전송됨)
    await fetch(SHEETS_API_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(entry),
    });
    return { ok: true };
  } catch (err) {
    return { ok: false, error: err.message };
  }
}

async function fetchFromSheets() {
  try {
    const response = await fetch(SHEETS_API_URL, { method: 'GET' });
    const json = await response.json();
    if (json.ok && json.data) {
      return json.data.map((row, idx) => ({
        rowNum: idx + 2, // 시트 실제 행 번호 (헤더=1, 첫 데이터=2)
        timestamp: row['추천일시'] ? new Date(row['추천일시']).toLocaleString('ko-KR') : '',
        teacher: row['추천교사'] || '',
        category: CATEGORY_LABEL_TO_KEY[row['추천부문']] || 'character',
        grade: parseInt(row['학년']) || 0,
        class: parseInt(row['반']) || 0,
        number: parseInt(row['번호']) || 0,
        sno: parseInt(row['학번']) || 0,
        studentName: row['학생이름'] || '',
        reason: row['추천사유'] || '',
        monthGoal: row['월별목표'] || '',
        week: row['주차'] || '',
        month: row['월별목표'] ? findMonthByGoal(row['월별목표']) : new Date(row['추천일시']).getMonth() + 1,
      }));
    }
    return null;
  } catch (err) {
    console.error('Fetch error:', err);
    return null;
  }
}

async function deleteFromSheets(rowNum) {
  try {
    const response = await fetch(`${SHEETS_API_URL}?action=delete&row=${rowNum}`, { method: 'GET' });
    const json = await response.json();
    return json.ok === true;
  } catch (err) {
    console.error('Delete error:', err);
    return false;
  }
}

function findMonthByGoal(goal) {
  for (const [m, data] of Object.entries(MONTHLY_GOALS)) {
    if (data.title === goal) return parseInt(m);
  }
  return new Date().getMonth() + 1;
}

function App() {
  const [students] = useState(() => {
    return typeof INITIAL_STUDENTS !== 'undefined' ? INITIAL_STUDENTS : [];
  });

  const [recommendationLog, setRecommendationLog] = useState([]);
  const [pendingQueue, setPendingQueue] = useState(() => {
    try { return JSON.parse(localStorage.getItem('bss_pending') || '[]'); } catch { return []; }
  });
  const [syncStatus, setSyncStatus] = useState('idle'); // idle | syncing | success | error
  const [lastSync, setLastSync] = useState(null);

  const [teacherName, setTeacherName] = useState(() => localStorage.getItem('bss_teacher') || '');
  const [selectedIds, setSelectedIds] = useState(new Set());
  const [category, setCategory] = useState('character');
  const [reason, setReason] = useState('');
  const [searchQuery, setSearchQuery] = useState('');
  const [gradeFilter, setGradeFilter] = useState('전체');
  const [classFilter, setClassFilter] = useState('전체');
  const [mode, setMode] = useState('home');
  const [miniIndex, setMiniIndex] = useState(0);
  const [miniCandidates, setMiniCandidates] = useState([]);
  const [justBragged, setJustBragged] = useState(null);
  const [isAdminUnlocked, setIsAdminUnlocked] = useState(false);
  const [showPwModal, setShowPwModal] = useState(false);
  const [pwInput, setPwInput] = useState('');
  const [pwError, setPwError] = useState('');
  const [showInstall, setShowInstall] = useState(false);
  const [showMonthCalendar, setShowMonthCalendar] = useState(false);
  const [showPhotoGuide, setShowPhotoGuide] = useState(false);

  useEffect(() => { localStorage.setItem('bss_teacher', teacherName); }, [teacherName]);
  useEffect(() => { localStorage.setItem('bss_pending', JSON.stringify(pendingQueue)); }, [pendingQueue]);

  const currentMonth = new Date().getMonth() + 1;
  const currentMonthData = MONTHLY_GOALS[currentMonth] || { title: '바른 인재상', emoji: '🌟', tags: [] };
  const currentMonthGoal = currentMonthData.title;
  const currentMonthEmoji = currentMonthData.emoji;
  const currentMonthTags = currentMonthData.tags;

  const getWeekKey = (date = new Date()) => {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + 4 - (d.getDay() || 7));
    const yearStart = new Date(d.getFullYear(), 0, 1);
    const weekNo = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
    return `${d.getFullYear()}-W${String(weekNo).padStart(2, '0')}`;
  };
  const currentWeek = getWeekKey();

  // ===== 시트 동기화 =====
  const syncFromSheets = useCallback(async () => {
    setSyncStatus('syncing');
    const data = await fetchFromSheets();
    if (data !== null) {
      // 시트 데이터를 timestamp 역순으로 정렬
      data.sort((a, b) => {
        const ta = new Date(a.timestamp).getTime();
        const tb = new Date(b.timestamp).getTime();
        return tb - ta;
      });
      setRecommendationLog(data);
      setSyncStatus('success');
      setLastSync(new Date());
    } else {
      setSyncStatus('error');
    }
  }, []);

  // 페이지 로드 + 주기적 동기화
  useEffect(() => {
    syncFromSheets();
    const interval = setInterval(syncFromSheets, SYNC_INTERVAL);
    return () => clearInterval(interval);
  }, [syncFromSheets]);

  // 대기 큐 재전송
  useEffect(() => {
    if (pendingQueue.length === 0) return;
    const tryResend = async () => {
      const remaining = [];
      for (const entry of pendingQueue) {
        const result = await postToSheets(entry);
        if (!result.ok) remaining.push(entry);
      }
      setPendingQueue(remaining);
      if (remaining.length === 0) {
        setTimeout(syncFromSheets, 1500);
      }
    };
    tryResend();
  }, [pendingQueue.length === 0]); // 큐가 비었다가 차면 재시도

  const requireAdmin = (callback) => {
    if (isAdminUnlocked) { callback(); return; }
    setShowPwModal(true);
    setPwInput(''); setPwError('');
    window._pendingAdminAction = callback;
  };

  const submitPassword = () => {
    if (pwInput === ADMIN_PASSWORD) {
      setIsAdminUnlocked(true);
      setShowPwModal(false);
      setPwError('');
      if (window._pendingAdminAction) {
        window._pendingAdminAction();
        window._pendingAdminAction = null;
      }
      setTimeout(() => setIsAdminUnlocked(false), 30 * 60 * 1000);
    } else {
      setPwError('비밀번호가 일치하지 않습니다.');
      setPwInput('');
    }
  };

  const filteredStudents = useMemo(() => {
    return students.filter(s => {
      const matchGrade = gradeFilter === '전체' || String(s.grade) === gradeFilter;
      const matchClass = classFilter === '전체' || String(s.class) === classFilter;
      const matchSearch = !searchQuery ||
        s.name.includes(searchQuery) ||
        String(s.sno).includes(searchQuery) ||
        (s.teacher && s.teacher.includes(searchQuery));
      return matchGrade && matchClass && matchSearch;
    });
  }, [students, searchQuery, gradeFilter, classFilter]);

  const availableClasses = useMemo(() => {
    const set = new Set(students.filter(s => gradeFilter === '전체' || String(s.grade) === gradeFilter).map(s => s.class).filter(Boolean));
    return ['전체', ...Array.from(set).sort((a, b) => a - b).map(String)];
  }, [students, gradeFilter]);

  const toggleSelect = (id) => {
    setSelectedIds(prev => { const n = new Set(prev); if (n.has(id)) n.delete(id); else n.add(id); return n; });
  };

  const startMiniMode = () => {
    if (!teacherName.trim()) { alert('먼저 선생님 성함을 입력해주세요.'); return; }
    if (students.length === 0) { alert('학생 명단이 없습니다.'); return; }
    const shuffled = [...students].sort(() => Math.random() - 0.5);
    setMiniCandidates(shuffled.slice(0, Math.min(12, students.length)));
    setMiniIndex(0);
    setMode('mini');
  };

  // ===== 추천 제출 =====
  const submitOne = async (student, quickReason = '') => {
    const entry = {
      timestamp: new Date().toLocaleString('ko-KR'),
      week: currentWeek, month: currentMonth,
      monthGoal: currentMonthGoal,
      teacher: teacherName.trim(),
      studentName: student.name,
      grade: student.grade, class: student.class,
      number: student.number, sno: student.sno,
      category: CATEGORIES[category].label, // 시트에는 한글로 저장
      reason: quickReason || reason.trim(),
    };
    
    // 즉시 화면에 반영 (낙관적 업데이트)
    const optimistic = { ...entry, category: category }; // 화면용은 key로
    setRecommendationLog(prev => [optimistic, ...prev]);
    setJustBragged(student);
    setTimeout(() => setJustBragged(null), 1300);
    
    // 시트에 전송
    const result = await postToSheets(entry);
    if (!result.ok) {
      // 실패 시 대기 큐에 추가
      setPendingQueue(prev => [...prev, entry]);
    } else {
      // 성공 시 약간 후 시트에서 재동기화
      setTimeout(syncFromSheets, 2000);
    }
  };

  const bragOne = (student, quickReason = '') => {
    submitOne(student, quickReason);
  };

  const skipMini = () => {
    if (miniIndex < miniCandidates.length - 1) setMiniIndex(miniIndex + 1);
    else { setMode('home'); setReason(''); }
  };
  const nextMini = () => {
    if (miniIndex < miniCandidates.length - 1) { setMiniIndex(miniIndex + 1); setReason(''); }
    else { setMode('home'); setReason(''); alert('이번 주 추천 완료! 고생하셨습니다.'); }
  };

  const submitBatch = async () => {
    if (selectedIds.size === 0) return alert('추천할 학생을 선택해주세요.');
    if (!teacherName.trim()) return alert('선생님 성함을 입력해주세요.');
    
    const selected = students.filter(s => selectedIds.has(s.id));
    
    // 순차 전송
    for (const s of selected) {
      const entry = {
        timestamp: new Date().toLocaleString('ko-KR'),
        week: currentWeek, month: currentMonth,
        monthGoal: currentMonthGoal,
        teacher: teacherName.trim(),
        studentName: s.name,
        grade: s.grade, class: s.class,
        number: s.number, sno: s.sno,
        category: CATEGORIES[category].label,
        reason: reason.trim(),
      };
      
      // 화면 즉시 반영
      setRecommendationLog(prev => [{ ...entry, category: category }, ...prev]);
      
      // 시트 전송
      const result = await postToSheets(entry);
      if (!result.ok) {
        setPendingQueue(prev => [...prev, entry]);
      }
    }
    
    setSelectedIds(new Set());
    setReason('');
    alert(`${selected.length}명 추천 완료! 잠시 후 시트에 반영됩니다.`);
    setTimeout(syncFromSheets, 3000);
  };

  // 추천 취소 (관리자 전용)
  const cancelRecommendation = async (entry) => {
    if (!isAdminUnlocked) {
      requireAdmin(() => cancelRecommendation(entry));
      return;
    }
    if (!confirm(`${entry.studentName} 학생의 추천을 취소하시겠습니까?\n\n추천교사: ${entry.teacher}\n추천일시: ${entry.timestamp}`)) return;
    // 화면에서 즉시 제거
    setRecommendationLog(prev => prev.filter(r => r !== entry));
    // 시트에서 삭제
    if (entry.rowNum) {
      const ok = await deleteFromSheets(entry.rowNum);
      if (!ok) {
        alert('시트 삭제 중 오류가 발생했습니다.\n구글 시트에서 직접 삭제해주세요.');
        syncFromSheets();
      } else {
        setTimeout(syncFromSheets, 1000);
      }
    }
  };

  const downloadCSV = () => {
    if (recommendationLog.length === 0) return alert('다운로드할 내역이 없습니다.');

      r.grade ? r.grade + '학년' : '',
      r.class || '', r.number || '', r.sno || '',
      r.studentName, r.reason || '',
    ]);
    const csv = [headers, ...rows].map(row => row.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `바른인재추천_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
    URL.revokeObjectURL(url);
  };

              <button onClick={() => setShowMonthCalendar(true)} className="dodum text-xs text-blue-700 hover:text-blue-900">연간 →</button>
            </div>

            <div className="mb-4 glass p-3 rounded-xl">
              <div className="flex flex-wrap items-center gap-2">
                <input type="text" placeholder="🔍 이름·학번·담임 검색" value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                  className="dodum flex-1 min-w-[180px] px-4 py-2 border border-slate-200 rounded-full text-sm bg-white" />
                <select value={gradeFilter} onChange={e => { setGradeFilter(e.target.value); setClassFilter('전체'); }}
                  className="dodum px-3 py-2 border border-slate-200 rounded-full text-sm bg-white">
                  <option value="전체">전체 학년</option>
                  <option value="1">1학년</option>
                  <option value="2">2학년</option>
                  <option value="3">3학년</option>
                </select>
                <select value={classFilter} onChange={e => setClassFilter(e.target.value)}
                  className="dodum px-3 py-2 border border-slate-200 rounded-full text-sm bg-white">
                  {availableClasses.map(c => <option key={c} value={c}>{c === '전체' ? '전체 반' : c + '반'}</option>)}
                </select>
                <div className="dodum text-sm text-slate-700 ml-auto">
                  {filteredStudents.length}명 · 선택 <span className="font-bold text-blue-700">{selectedIds.size}</span>
                </div>
              </div>
            </div>

            <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-7 gap-2 mb-24">
              {filteredStudents.map(student => (
                <StudentCard key={student.id} student={student} isSelected={selectedIds.has(student.id)}
                  onToggle={() => toggleSelect(student.id)} />
              ))}
            </div>

            {selectedIds.size > 0 && (
              <div className="fixed bottom-4 left-4 right-4 max-w-3xl mx-auto bg-white rounded-2xl card-shadow p-4 pop-in border-2 border-blue-300">
                <div className="flex flex-wrap items-center gap-3">
                  <div className="flex-1 min-w-[180px]">
                    <div className="myeongjo text-base font-bold text-slate-800 mb-1">
                      {selectedIds.size}명을 <span className="text-blue-700">{CATEGORIES[category].label}</span>으로 추천
                    </div>
                    <input type="text" placeholder="추천 사유 (선택)" value={reason} onChange={e => setReason(e.target.value)}
                      className="dodum w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm" />
                    <div className="flex flex-wrap gap-1.5 mt-2">
                      {currentMonthTags.slice(0, 3).map(tag => (
                        <button key={tag} onClick={() => setReason(tag)}
                          className="dodum text-[10px] px-2 py-0.5 bg-blue-50 text-blue-700 rounded-full border border-blue-200 hover:bg-blue-100">
                          {tag}
                        </button>
                      ))}
                    </div>
                  </div>
                  <button onClick={submitBatch} className={`dodum ${deptClass(category)} text-white px-6 py-3 rounded-full font-bold hover:shadow-lg`}>
                    💝 추천 제출
                  </button>
                </div>
              </div>
            )}
          </div>
        )}

        {mode === 'dashboard' && (
          <div className="pop-in">
            <div className="mb-6 flex items-center justify-between flex-wrap gap-2">
              <div>
                <div className="myeongjo text-3xl font-bold text-slate-800 mb-1">우리 학교 추천 현황</div>
                <div className="dodum text-sm text-slate-500">{currentMonthEmoji} {currentMonth}월 목표: {currentMonthGoal}</div>
                <div className="dodum text-xs text-slate-400 mt-1">
                  {lastSync ? `마지막 동기화: ${lastSync.toLocaleTimeString('ko-KR')}` : '시트와 동기화 중...'}
                  · 30초마다 자동 갱신
                </div>
              </div>
              <div className="flex gap-2">
                <button onClick={syncFromSheets} className="dodum text-sm bg-white border-2 border-blue-200 text-blue-700 px-4 py-2 rounded-full hover:bg-blue-50">
                  🔄 새로고침
                </button>
                <button onClick={() => setShowMonthCalendar(true)} className="dodum text-sm bg-white border-2 border-blue-200 text-blue-700 px-4 py-2 rounded-full hover:bg-blue-50">
                  📅 연간
                </button>
              </div>
            </div>

            <div className="grid md:grid-cols-4 gap-3 mb-6">
              <BigStat emoji="📅" label={`${currentMonth}월`} value={stats.thisMonth} accent />
              <BigStat emoji="🎉" label="누적 추천" value={stats.total} />
              <BigStat emoji="👩‍🏫" label="참여 선생님" value={stats.totalTeachers} />
              <BigStat emoji="🌟" label="추천받은 학생" value={stats.uniqueStudents} />
            </div>

            <div className="glass rounded-2xl p-5 mb-6">
              <div className="myeongjo text-lg font-bold text-slate-800 mb-3">📊 부문별 추천 분포</div>
              <div className="grid grid-cols-3 gap-3">
                {Object.entries(CATEGORIES).map(([key, cat]) => (
                  <div key={key} className={`p-4 rounded-xl text-white ${deptClass(key)}`}>
                    <div className="text-2xl mb-1">{cat.icon}</div>
                    <div className="dodum text-xs opacity-90">{cat.label}</div>
                    <div className="myeongjo text-3xl font-bold mt-1">{stats.byCategory[key]}</div>
                  </div>
                ))}
              </div>
            </div>

            <div className="bg-white rounded-2xl p-5 card-shadow mb-6">
              <div className="myeongjo text-lg font-bold text-slate-800 mb-3">📅 월별 추천 현황</div>
              <div className="grid grid-cols-3 md:grid-cols-5 gap-2">
                {ALL_MONTHS.map(m => {
                  const g = MONTHLY_GOALS[m];
                  const cnt = stats.byMonth[m] || 0;
                  const isCurrent = m === currentMonth;
                  return (
                    <div key={m} className={`p-3 rounded-xl text-center ${isCurrent ? 'dept-character text-white' : 'bg-slate-50'}`}>
                      <div className="text-xl">{g.emoji}</div>
                      <div className={`dodum text-xs font-bold ${isCurrent ? '' : 'text-slate-600'}`}>
                        {m === 7 ? '7~8월' : m + '월'}
                      </div>
                      <div className={`myeongjo text-xl font-bold ${isCurrent ? '' : 'text-slate-800'}`}>{cnt}</div>
                    </div>
                  );
                })}
              </div>
            </div>

            {stats.topStudents.length > 0 && (
              <div className="bg-white rounded-2xl p-5 card-shadow mb-6">
                <div className="myeongjo text-lg font-bold text-slate-800 mb-3">🏆 가장 많이 추천받은 학생</div>
                <div className="space-y-2">
                  {stats.topStudents.map((s, idx) => (
                    <div key={idx} className="flex items-center gap-3 p-3 bg-gradient-to-r from-blue-50 to-cyan-50 rounded-xl">
                      <div className="myeongjo text-xl font-bold text-blue-700 w-8">{idx + 1}</div>
                      <div className="flex-1">
                        <div className="myeongjo text-base font-bold text-slate-800">{s.name}</div>
                        <div className="dodum text-xs text-slate-500">{s.grade}학년 {s.class}반</div>
                      </div>
                      <div className="dodum text-sm font-bold text-slate-700">{s.count}회</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {recommendationLog.length > 0 && (
              <div className="bg-white rounded-2xl p-5 card-shadow mb-6">
                <div className="flex items-center justify-between mb-3">
                  <div className="myeongjo text-lg font-bold text-slate-800">최근 추천 내역</div>
                  <button onClick={downloadCSV} className="dodum text-sm bg-slate-800 text-white px-4 py-2 rounded-full">📥 CSV</button>
                </div>
                <div className="space-y-2 max-h-96 overflow-y-auto">
                  {recommendationLog.slice(0, 50).map((r, idx) => (
                    <div key={idx} className="flex items-start gap-3 p-3 border-b border-slate-100 last:border-0 group hover:bg-slate-50 rounded-xl transition">
                      <div className="text-2xl">{CATEGORIES[r.category]?.icon || '💝'}</div>
                      <div className="flex-1">
                        <div className="dodum text-sm">
                          <span className="font-bold text-slate-700">{r.teacher}</span> 선생님이{' '}
                          <span className="font-bold text-blue-700">{r.studentName}</span>
                          {r.grade && <span className="text-slate-500 text-xs"> ({r.grade}-{r.class})</span>}
                          {' '}학생을 <span className="font-bold">{CATEGORIES[r.category]?.label || ''}</span>으로 추천
                        </div>
                        {r.reason && <div className="dodum text-sm text-slate-600 mt-1">💬 "{r.reason}"</div>}
                        <div className="text-xs text-slate-400 mt-1">
                          {r.timestamp}
                          {r.monthGoal && <span className="ml-2 text-blue-500">· {r.monthGoal}</span>}
                        </div>
                      </div>
                      {/* 삭제 버튼 - 마우스 올리면 나타남 */}
                      {isAdminUnlocked ? (
                        <button
                          onClick={() => cancelRecommendation(r)}
                          className="dodum flex-shrink-0 text-xs text-red-500 hover:text-white hover:bg-red-500 border border-red-300 px-2.5 py-1 rounded-full transition opacity-0 group-hover:opacity-100"
                        >
                          취소
                        </button>
                      ) : (
                        <button
                          onClick={() => requireAdmin(() => {})}
                          className="dodum flex-shrink-0 text-xs text-slate-400 hover:text-red-500 px-2 py-1 rounded-full transition opacity-0 group-hover:opacity-100"
                          title="관리자 인증 후 취소 가능"
                        >
                          🔒
                        </button>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {recommendationLog.length === 0 && (
              <div className="glass rounded-2xl p-12 text-center">
                <div className="text-6xl mb-4">🌱</div>
                <div className="myeongjo text-xl text-slate-600 mb-2">아직 추천 내역이 없습니다</div>
                <div className="dodum text-sm text-slate-500 mb-4">첫 추천이 들어오면 여기에 표시됩니다</div>
                <button onClick={() => setMode('home')} className="dodum dept-character text-white px-6 py-3 rounded-full mt-2 font-bold">
                  첫 추천 시작하기
                </button>
              </div>
            )}
          </div>
        )}

        {mode === 'manage' && (
          <div className="pop-in">
            <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-2xl">🔓</span>
                  <div className="myeongjo text-2xl font-bold text-slate-800">관리자 모드</div>
                </div>
                <div className="dodum text-sm text-slate-500">전체 {students.length}명 등록 · 구글 시트 연동 활성화</div>
              </div>
              <button onClick={() => { setIsAdminUnlocked(false); setMode('home'); }}
                className="dodum text-xs px-3 py-2 bg-slate-200 text-slate-700 rounded-full hover:bg-slate-300">
                🔒 잠그기
              </button>
            </div>

            <div className="bg-white rounded-2xl p-5 card-shadow mb-5">
              <div className="flex items-start gap-3 mb-4">
                <div className="text-3xl">☁️</div>
                <div className="flex-1">
                  <div className="myeongjo text-lg font-bold text-slate-800 mb-1">구글 시트 연동 상태</div>
                  <div className="dodum text-sm text-slate-600 leading-relaxed">
                    모든 추천이 학교 구글 시트에 자동 저장됩니다.<br/>
                    <span className="text-slate-500 text-xs">대기 큐: {pendingQueue.length}건 · 마지막 동기화: {lastSync ? lastSync.toLocaleTimeString('ko-KR') : '동기화 중'}</span>
                  </div>
                </div>
              </div>
              <div className="flex flex-wrap gap-2">
                <button onClick={syncFromSheets} className="dodum bg-blue-700 text-white px-4 py-2.5 rounded-full text-sm hover:bg-blue-800">
                  🔄 시트 강제 새로고침
                </button>
                {pendingQueue.length > 0 && (
                  <button onClick={() => setPendingQueue([])} className="dodum bg-red-100 text-red-700 px-4 py-2.5 rounded-full text-sm hover:bg-red-200">
                    🗑 대기 큐 비우기 ({pendingQueue.length}건)
                  </button>
                )}
              </div>
            </div>

            <div className="bg-white rounded-2xl p-5 card-shadow mb-5">
              <div className="flex items-start gap-3 mb-4">
                <div className="text-3xl">📸</div>
                <div className="flex-1">
                  <div className="myeongjo text-lg font-bold text-slate-800 mb-1">학생 사진 관리</div>
                  <div className="dodum text-sm text-slate-600 leading-relaxed">
                    경로: <code className="bg-slate-100 px-1.5 py-0.5 rounded text-xs">photos/&#123;학년&#125;/&#123;학번&#125;.jpg</code>
                  </div>
                </div>
              </div>
              <div className="flex flex-wrap gap-2">
                <button onClick={() => setShowPhotoGuide(true)} className="dodum bg-blue-700 text-white px-4 py-2.5 rounded-full text-sm hover:bg-blue-800">
                  📖 사진 업로드 가이드
                </button>
                <button onClick={downloadPhotoMapping} className="dodum bg-slate-800 text-white px-4 py-2.5 rounded-full text-sm hover:bg-slate-900">
                  📥 학번-파일명 매핑표
                </button>
              </div>
            </div>

            <div className="bg-white rounded-2xl p-5 card-shadow mb-5">
              <div className="myeongjo text-lg font-bold text-slate-800 mb-3">🔍 사진 로딩 상태</div>
              <div className="flex flex-wrap items-center gap-2 mb-3">
                <select value={gradeFilter} onChange={e => { setGradeFilter(e.target.value); setClassFilter('전체'); }}
                  className="dodum px-3 py-2 border border-slate-200 rounded-full text-sm bg-white">
                  <option value="전체">전체 학년</option>
                  <option value="1">1학년</option>
                  <option value="2">2학년</option>
                  <option value="3">3학년</option>
                </select>
                <select value={classFilter} onChange={e => setClassFilter(e.target.value)}
                  className="dodum px-3 py-2 border border-slate-200 rounded-full text-sm bg-white">
                  {availableClasses.map(c => <option key={c} value={c}>{c === '전체' ? '전체 반' : c + '반'}</option>)}
                </select>
                <input type="text" placeholder="🔍 이름 검색" value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                  className="dodum flex-1 min-w-[150px] px-4 py-2 border border-slate-200 rounded-full text-sm" />
              </div>
              <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2">
                {filteredStudents.map(student => (
                  <div key={student.id} className="bg-slate-50 rounded-lg overflow-hidden">
                    <div className="aspect-square relative">
                      <StudentPhoto student={student} size="small" />
                    </div>
                    <div className="p-1.5 text-center">
                      <div className="myeongjo text-xs font-bold text-slate-800 truncate">{student.name}</div>
                      <div className="dodum text-[9px] text-slate-500">{student.sno}.jpg</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}
      </main>

      <footer className="py-8 text-center text-xs text-slate-500 dodum">
        부산과학고등학교 · 바른인재 발굴 프로젝트 · 2026학년도
        <br/>
        <span className="text-slate-400">추천 데이터는 학교 구글 시트에 실시간 저장됩니다</span>
      </footer>
    </div>
  );
}

// 동기화 상태 표시
function SyncIndicator({ status, lastSync, pendingCount, onClick }) {
  const statusColor = {
    idle: 'text-slate-500',
    syncing: 'text-blue-500',
    success: 'text-green-600',
    error: 'text-red-500',
  }[status];
  
  const statusIcon = {
    idle: '☁️',
    syncing: '🔄',
    success: '✅',
    error: '⚠️',
  }[status];
  
  return (
    <button onClick={onClick}
      className={`hidden md:flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs glass dodum ${statusColor} hover:bg-white transition`}>
      <span className={status === 'syncing' ? 'spin' : ''}>{statusIcon}</span>
      <span>
        {status === 'syncing' && '동기화 중'}
        {status === 'success' && '시트 연결됨'}
        {status === 'error' && '연결 오류'}
        {status === 'idle' && '대기 중'}
      </span>
      {pendingCount > 0 && (
        <span className="bg-amber-500 text-white px-1.5 rounded-full text-[10px]">{pendingCount}</span>
      )}
    </button>
  );
}

function NavBtn({ active, onClick, emoji, label }) {
  return (
    <button onClick={onClick} className={`flex items-center gap-1.5 px-3 py-2 rounded-full text-sm dodum transition ${active ? 'bg-slate-800 text-white' : 'text-slate-700 hover:bg-white/60'}`}>
      <span>{emoji}</span>
      <span className="hidden sm:inline">{label}</span>
    </button>
  );
}

function MiniStat({ icon, value, label }) {
  return (
    <div className="text-center">
      <div className="text-xl mb-1">{icon}</div>
      <div className="myeongjo text-2xl font-bold text-slate-800">{value}</div>
      <div className="dodum text-[11px] text-slate-500 leading-tight">{label}</div>
    </div>
  );
}

function BigStat({ emoji, label, value, accent }) {
  return (
    <div className={`${accent ? 'dept-character text-white' : 'bg-white text-slate-800'} rounded-2xl p-5 card-shadow`}>
      <div className="text-3xl mb-2">{emoji}</div>
      <div className={`dodum text-xs ${accent ? 'text-white/80' : 'text-slate-500'} mb-1`}>{label}</div>
      <div className="myeongjo text-4xl font-bold">{value}</div>
    </div>
  );
}

function StudentPhoto({ student, size = 'medium' }) {
  const [extIdx, setExtIdx] = useState(0);
  const iconSize = size === 'large' ? '120px' : size === 'small' ? '32px' : '50px';
  
  if (extIdx < PHOTO_EXTENSIONS.length) {
    const src = `photos/${student.grade}/${student.class}/${student.sno}.${PHOTO_EXTENSIONS[extIdx]}`;
    return (
      <img src={src} alt={student.name} className="w-full h-full object-cover"
        onError={() => setExtIdx(extIdx + 1)} />
    );
  }
  
  return (
    <div className="w-full h-full flex items-center justify-center text-blue-200" style={{fontSize: iconSize}}>
      👤
    </div>
  );
}

function StudentCard({ student, isSelected, onToggle }) {
  return (
    <div onClick={onToggle}
      className={`relative bg-white rounded-xl overflow-hidden hover-lift cursor-pointer ${isSelected ? 'ring-4 ring-blue-500' : ''}`}>
      {isSelected && (
        <div className="absolute top-2 right-2 w-7 h-7 bg-blue-600 text-white flex items-center justify-center rounded-full z-10 pop-in font-bold">✓</div>
      )}
      <div className="aspect-square bg-gradient-to-br from-blue-50 to-cyan-50 relative">
        <StudentPhoto student={student} />
        <div className="absolute top-2 left-2 dodum text-[10px] bg-black/60 text-white px-2 py-0.5 rounded-full">
          {student.grade}-{student.class}-{String(student.number).padStart(2, '0')}
        </div>
      </div>
      <div className="p-3">
        <div className="myeongjo text-lg font-bold text-slate-800 truncate leading-tight">{student.name}</div>
        <div className="dodum text-xs text-slate-500 mt-0.5">
          {student.grade}학년 {student.class}반 · {student.number}번
        </div>
        {student.teacher && (
          <div className="dodum text-[10px] text-slate-400 truncate mt-0.5">담임 {student.teacher}</div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
